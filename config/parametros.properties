# ==============================================================
# Parámetros del simulador de gestión de pistas
# Valores simulados definidos por el equipo (no son datos reales)
# Unidades: minutos de tiempo simulado
# ==============================================================

# Separación mínima entre el INICIO de dos operaciones consecutivas en la misma pista
separacion.aterrizaje_tras_aterrizaje=3
# Cualquier otra combinación (aterrizaje tras despegue, despegue tras aterrizaje, despegue tras despegue)
separacion.otros=2

# Tiempo que una operación ocupa la pista
ocupacion.aterrizaje=2
ocupacion.despegue=1

# Autonomía (minutos) por debajo de la cual un aterrizaje se clasifica como COMBUSTIBLE_BAJO
combustible.umbral_minutos=20

# Espera máxima de una solicitud REGULAR antes de subir de nivel (regla anti-inanición)
espera.limite_regular_minutos=15

# Configuración general de la simulación
simulacion.numero_pistas=2
simulacion.duracion_minutos=180
